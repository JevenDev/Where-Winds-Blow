plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = maven_group

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

base {
    archivesName = archives_base_name
}

def useLocalToucanLib = project.findProperty('useLocalToucanLib')?.toBoolean() ?: false

repositories {
    if (useLocalToucanLib) {
        mavenLocal()
    }

    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Sinytra'
        url = 'https://maven.sinytra.org/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
    }
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    if (useLocalToucanLib) {
        implementation "com.jvn.toucanlib:toucanlib-neoforge-${minecraft_version}:${toucanlib_version}"
    } else {
        implementation "maven.modrinth:toucan:${toucanlib_neoforge_version}"
    }
    implementation "dev.isxander:yet-another-config-lib:${yacl_version}"
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_compile_version}"
    compileOnly "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:${fabric_renderer_api_compile_version}"
    compileOnly "maven.modrinth:acedium-sodiumized:${acedium_compile_version}"
}

var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        yacl_version           : yacl_version,
        architectury_version   : architectury_version,
        toucanlib_version      : toucanlib_version,
        sodium_version_range: sodium_version_range,
        acedium_version_range: acedium_version_range,
        iris_version_range: iris_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_authors            : mod_authors,
        mod_display_url        : mod_display_url,
        mod_issue_tracker      : mod_issue_tracker,
        mod_license            : mod_license,
        mod_description        : mod_description,
        mod_version            : mod_version,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localRelease'
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xlint:deprecation'])
}

sourceSets {
    snowLoggingTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    grassWorldgenTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    particleWindTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    windExposureTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    foliageInteractionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    mods {
        snowLoggingTests {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.snowLoggingTest)
        }
    }
    runs.configureEach {
        loadedMods = [mods."${mod_id}"]
    }
    runs.gameTestServer {
        loadedMods = [mods.snowLoggingTests]
        gameDirectory = layout.buildDirectory.dir('snowlogging-gametest')
        logLevel = org.slf4j.event.Level.INFO
    }
}

tasks.register('testGrassWorldgen', JavaExec) {
    group = 'verification'
    description = 'Checks dense grass transitions, terrain placement, and vegetation preservation.'
    dependsOn tasks.named('grassWorldgenTestClasses')
    classpath = sourceSets.grassWorldgenTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.worldgen.GrassWorldgenTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testParticleWindProfiles', JavaExec) {
    group = 'verification'
    description = 'Checks particle wind profile parsing, overrides, and resource reloads.'
    dependsOn tasks.named('particleWindTestClasses')
    classpath = sourceSets.particleWindTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.client.particle.ParticleWindProfilesTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testWindExposure', JavaExec) {
    group = 'verification'
    description = 'Checks sky exposure with renderer world views that do not expose a light engine.'
    dependsOn tasks.named('windExposureTestClasses')
    classpath = sourceSets.windExposureTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.client.wind.WindExposureCacheTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testWindVisuals', JavaExec) {
    group = 'verification'
    description = 'Checks outdoor wind placement, collision paths, and render interpolation.'
    dependsOn tasks.named('windExposureTestClasses')
    classpath = sourceSets.windExposureTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.client.wind.WindVisualsTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testFoliageInteraction', JavaExec) {
    group = 'verification'
    description = 'Checks vertical contact bounds for foliage interaction.'
    dependsOn tasks.named('foliageInteractionTestClasses')
    classpath = sourceSets.foliageInteractionTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.client.foliage.FoliageInteractionTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testFoliageInteractionShaders', JavaExec) {
    group = 'verification'
    description = 'Checks foliage interaction shaders using a local OpenGL context.'
    dependsOn tasks.named('foliageInteractionTestClasses')
    classpath = sourceSets.foliageInteractionTest.runtimeClasspath
    mainClass = 'com.jvn.wherewindsblow.client.foliage.FoliageInteractionShaderTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('testVeilFoliageShaders', JavaExec) {
    group = 'verification'
    description = 'Checks foliage shaders after processing with the GLSL processor jar bundled in Veil.'
    dependsOn tasks.named('foliageInteractionTestClasses')
    classpath = sourceSets.foliageInteractionTest.runtimeClasspath + files(providers.gradleProperty('veilGlslProcessorJar'))
    mainClass = 'com.jvn.wherewindsblow.client.foliage.FoliageInteractionShaderTest'
    args '--veil'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('packageNetherStarWindExample', Zip) {
    group = 'build'
    description = 'Packages the nether star particle wind example resource pack.'
    from 'examples/resourcepacks/nether-star-wind'
    destinationDirectory = layout.buildDirectory.dir('example-packs')
    archiveFileName = 'where-winds-blow-nether-star-wind-1.21.1.zip'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('check') {
    dependsOn tasks.named('testGrassWorldgen')
    dependsOn tasks.named('testParticleWindProfiles')
    dependsOn tasks.named('testWindExposure')
    dependsOn tasks.named('testWindVisuals')
    dependsOn tasks.named('testFoliageInteraction')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
